<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIM AGHD-250ELC • 3D/CAD Мастер-Схема Сушильного Комплекса (Bento Cockpit OS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <style>
    :root {
      --bg-canvas: #07080C;
      --card-bg: #10121A;
      --well-bg: #0B0D14;
      --border-hairline: rgba(255, 255, 255, 0.072);
      --cobalt-glow: #2563EB;
      --sky-bright: #38BDF8;
      --cyan-mint: #2DD4BF;
      --amber-warm: #F59E0B;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(45% 40% at 24% 35%, rgba(245, 158, 11, 0.05), transparent 70%),
        radial-gradient(45% 45% at 72% 22%, rgba(37, 99, 235, 0.08), transparent 70%);
      color: #F8FAFC;
      font-family: var(--font-sans);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 12px 18px;
      gap: 6px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .toolbar {
      width: 100%;
      max-width: 1820px;
      background: linear-gradient(165deg, rgba(19, 23, 34, 0.94) 0%, rgba(11, 14, 22, 0.96) 100%);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-hairline);
      border-top: 1px solid rgba(96, 165, 250, 0.32);
      border-radius: 14px;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 12px 28px rgba(0, 0, 0, 0.85);
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 10px 4px 6px;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.35), rgba(15, 23, 42, 0.75));
      border: 1px solid rgba(96, 165, 250, 0.35);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #F8FAFC;
    }
    .brand-chip .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2DD4BF;
      box-shadow: 0 0 8px #2DD4BF;
    }

    .mode-switch, .btns {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-wrap: wrap;
    }

    .back-arm-btn {
      background: rgba(37, 99, 235, 0.16);
      color: #93C5FD;
      border: 1px solid rgba(96, 165, 250, 0.38);
      border-radius: 9px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.18s ease;
    }
    .back-arm-btn:hover { background: rgba(37, 99, 235, 0.28); color: #FFFFFF; }

    .m-btn {
      background: var(--well-bg);
      color: #94A3B8;
      border: 1px solid var(--border-hairline);
      border-radius: 9px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .m-btn:hover { color: #F8FAFC; border-color: rgba(96, 165, 250, 0.4); }
    .m-btn.active {
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
      color: #FFFFFF;
      border-color: rgba(147, 197, 253, 0.45);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
    }
    .m-btn.amber.active {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
      color: #FFFFFF;
      border-color: rgba(253, 230, 138, 0.45);
      box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
    }

    .btn {
      background: rgba(255, 255, 255, 0.04);
      color: #CBD5E1;
      border: 1px solid var(--border-hairline);
      padding: 5px 10px;
      font-size: 10.5px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.08); color: #FFFFFF; border-color: rgba(96, 165, 250, 0.4); }

    /* Компактная HUD-панель инспектора узлов в стиле Bento Popover */
    .hud-inspector-bar {
      width: 100%;
      max-width: 1820px;
      background: linear-gradient(165deg, #131620 0%, #0D0F17 100%);
      border: 1px solid var(--border-hairline);
      border-radius: 14px;
      padding: 7px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 12px 26px rgba(0, 0, 0, 0.75);
    }

    .node-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      flex: 1 1 100%;
    }
    .n-pill {
      padding: 4px 8px;
      border-radius: 7px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-hairline);
      background: var(--well-bg);
      color: #94A3B8;
      transition: all 0.18s ease;
    }
    .n-pill:hover { color: #F8FAFC; border-color: rgba(96, 165, 250, 0.4); }
    .n-pill.active {
      background: rgba(37, 99, 235, 0.22);
      color: #60A5FA;
      border-color: rgba(96, 165, 250, 0.55);
      box-shadow: 0 0 14px rgba(37, 99, 235, 0.35);
    }

    .insp-center {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--well-bg);
      border: 1px solid var(--border-hairline);
      border-left: 3px solid #3B82F6;
      border-radius: 10px;
      padding: 6px 12px;
      min-width: 0;
      flex: 1 1 420px;
    }
    .insp-title {
      font-size: 12px;
      font-weight: 700;
      color: #F8FAFC;
      white-space: nowrap;
    }
    .insp-desc {
      font-size: 11px;
      color: #94A3B8;
      line-height: 1.3;
    }

    .insp-grains-box {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--well-bg);
      border: 1px solid var(--border-hairline);
      border-radius: 10px;
      padding: 6px 12px;
    }
    .grain-bar { display: inline-flex; gap: 3px; align-items: center; }
    .grain-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); }
    .grain-dot.amber { background: #F59E0B; box-shadow: 0 0 6px #F59E0B; }
    .grain-dot.cyan { background: #2DD4BF; box-shadow: 0 0 6px #2DD4BF; }
    .grain-dot.blue { background: #3B82F6; box-shadow: 0 0 6px #3B82F6; }

    /* Главный 3D/CAD холст */
    .board {
      width: min(100%, calc((100vh - 134px) * 1800 / 830));
      width: min(100%, calc((100dvh - 134px) * 1800 / 830));
      max-width: 1820px;
      margin: 0 auto;
      background: #07080C;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 20px 50px rgba(0, 0, 0, 0.9);
      border: 1px solid var(--border-hairline);
      position: relative;
      aspect-ratio: 1800 / 830;
    }
    @media (max-height: 640px) {
      .board {
        width: 100%;
        aspect-ratio: auto;
      }
    }
    svg { display: block; width: 100%; height: 100%; font-family: var(--font-sans); }
    svg text {
      paint-order: stroke fill;
      stroke: #07080C;
      stroke-width: 1.8px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes dashFlow { to { stroke-dashoffset: -48; } }
    @keyframes spinCW { to { transform: rotate(360deg); } }
    @keyframes hsPulse {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .flow-anim { stroke-dasharray: 10 14; animation: dashFlow 0.85s linear infinite; pointer-events: none; }
    .flow-paused .flow-anim { display: none; }
    .spin-fan { transform-origin: center; transform-box: fill-box; animation: spinCW 1.3s linear infinite; }
    .flow-paused .spin-fan { animation-play-state: paused; }
    .svg-node-hit { cursor: pointer; transition: transform 0.2s ease; }
    .svg-node-hit:hover { filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6)); }
    .hotspot-pulse { animation: hsPulse 2.2s infinite ease-out; transform-origin: center; transform-box: fill-box; }

    @media print {
      body { background: #07080C; padding: 0; }
      .toolbar, .hud-inspector-bar { display: none; }
      .board { box-shadow: none; border: none; max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- ВЕРХНЯЯ ПРИБОРНАЯ ПАНЕЛЬ КОКПИТА -->
  <div class="toolbar">
    <div class="mode-switch">
      <a href="index.html" class="back-arm-btn" onclick="if(window.parent && window.parent !== window && typeof window.parent.ckSwitchMainDeck === 'function'){ window.parent.ckSwitchMainDeck('dashboard'); return false; }">
        <img src="logo-icon.png" onerror="this.style.display='none'" style="width:17px;height:17px;border-radius:4px;" alt=""/>
        ← В Кокпит АРМ
      </a>
      <span class="brand-chip"><span class="dot"></span>Юрмалциемс • Мастер-Схема v11</span>
      <button id="btnDry30" class="m-btn active" onclick="setWorkMode('DRY_30')">Сушка (30.0 Гц • 1#EEV 315 st)</button>
      <button id="btnPause18" class="m-btn amber" onclick="setWorkMode('PAUSE_18')">Пауза диффузии (18.0 Гц)</button>
      <button id="btnFinish25" class="m-btn" onclick="setWorkMode('FINISH_25')">Финиш Ст.4 (15–20 Гц • 1ч/4ч)</button>
      <button id="btnSeason" class="m-btn active" onclick="toggleSeason()">Зима: +14 кВт в цех (+35°C)</button>
      <button id="btnFlowAnim" class="m-btn active" onclick="toggleFlowAnim()">Потоки 3D: ВКЛ</button>
    </div>
    <div class="btns">
      <button class="btn" onclick="downloadPNG()">Экспорт 4K PNG</button>
      <button class="btn" onclick="downloadSVG()">Вектор SVG</button>
      <button class="btn" onclick="window.print()">Печать / PDF</button>
    </div>
  </div>

  <!-- КОМПАКТНЫЙ СТЕКЛЯННЫЙ ИНСПЕКТОР УЗЛОВ [1–10] -->
  <div class="hud-inspector-bar">
    <div class="node-pills" id="nodePillsBar"></div>
    <div class="insp-center" id="inspectorBody">
      <div>
        <div class="insp-title" id="inspTitle">[4] Наклонный испаритель 1#Dehumicoil (Slanted V-Evaporator)</div>
        <div class="insp-desc" id="inspDesc">Охлаждает влажный воздух из камеры (+12.4°C, 80% rH) ниже точки росы (+5.1°C) и конденсирует до 75 л/ч воды в дренажный трап [21].</div>
      </div>
    </div>
    <div class="insp-grains-box">
      <div>
        <div style="display:flex; justify-content:space-between; font-size:10px; color:#64748B; margin-bottom:4px;">
          <span>Нагрузка узла</span>
          <strong style="font-family:var(--font-mono); color:#38BDF8; margin-left:8px;" id="inspMetricTxt">+5.1°C • 75 л/ч</strong>
        </div>
        <div class="grain-bar" id="inspGrainBar"></div>
      </div>
    </div>
  </div>

  <!-- ГЛАВНЫЙ 3D/CAD РАЗРЕЗ СУШИЛЬНОГО КОМПЛЕКСА (БЕЗ ТЕКСТОВОГО ПОДВАЛА) -->
  <div class="board" id="svgBoard">
    <svg id="master-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 830" width="1800" height="830">
      <defs>
        <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#07080C"/>
          <stop offset="50%" stop-color="#0B0D14"/>
          <stop offset="100%" stop-color="#07080C"/>
        </linearGradient>
        <linearGradient id="bentoCard" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#131620"/>
          <stop offset="100%" stop-color="#0A0C12"/>
        </linearGradient>
        <linearGradient id="isoFloorG" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#132332"/>
          <stop offset="50%" stop-color="#291D12"/>
          <stop offset="100%" stop-color="#0B0E17"/>
        </linearGradient>
        <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
          <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.028)" stroke-width="0.8"/>
        </pattern>
        <pattern id="pu" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="12" stroke="#334155" stroke-width="1.5"/>
        </pattern>
        <filter id="sh" x="-6%" y="-6%" width="112%" height="112%">
          <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.75"/>
        </filter>

        <linearGradient id="blueV" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0F172A"/><stop offset="45%" stop-color="#2563EB"/><stop offset="100%" stop-color="#0F172A"/>
        </linearGradient>
        <linearGradient id="blkM" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#080A10"/><stop offset="45%" stop-color="#1E293B"/><stop offset="100%" stop-color="#080A10"/>
        </linearGradient>
        <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#78350F"/><stop offset="45%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#451A03"/>
        </linearGradient>
        <linearGradient id="goldF" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#451A03"/><stop offset="35%" stop-color="#D97706"/><stop offset="55%" stop-color="#FDE68A"/><stop offset="100%" stop-color="#451A03"/>
        </linearGradient>
        <linearGradient id="iceF" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#0C4A6E"/><stop offset="45%" stop-color="#0284C7"/><stop offset="55%" stop-color="#BAE6FD"/><stop offset="100%" stop-color="#082F49"/>
        </linearGradient>
        <linearGradient id="airCol" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#2563EB" stop-opacity="0.26"/>
          <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.22"/>
        </linearGradient>
        <linearGradient id="chamberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
          <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.08"/>
          <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
        </linearGradient>

        <g id="wArrL"><path d="M18,0 L-8,0 M-2,-5 L-11,0 L-2,5" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g id="wArrD"><path d="M0,-16 L0,8 M-5,2 L0,11 L5,2" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g id="wArrR"><path d="M-18,0 L8,0 M2,-5 L11,0 L2,5" stroke="#FBBF24" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g id="cArrR"><path d="M-18,0 L8,0 M2,-5 L11,0 L2,5" stroke="#38BDF8" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>
        <g id="hArrU"><path d="M0,16 L0,-8 M-5,-2 L0,-11 L5,-2" stroke="#F59E0B" stroke-width="3" fill="none" stroke-linecap="round"/></g>

        <g id="fan">
          <circle cx="0" cy="0" r="26" fill="#080A10" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
          <g class="spin-fan">
            <path d="M -20,0 L 20,0 M 0,-20 L 0,20 M -14,-14 L 14,14 M -14,14 L 14,-14" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="0" cy="0" r="6" fill="#2563EB" stroke="#93C5FD" stroke-width="1.2"/>
          </g>
        </g>

        <g id="chamberFanWheel">
          <circle cx="0" cy="0" r="20" fill="#080A10" stroke="rgba(255,255,255,0.2)" stroke-width="1.8"/>
          <g class="spin-fan">
            <line x1="-16" y1="0" x2="16" y2="0" stroke="#38BDF8" stroke-width="2.6"/>
            <line x1="0" y1="-16" x2="0" y2="16" stroke="#38BDF8" stroke-width="2.6"/>
            <circle cx="0" cy="0" r="4.5" fill="#2563EB" stroke="#FFF" stroke-width="1"/>
          </g>
        </g>

        <g id="fishRow">
          <path d="M11,0 C15,7 15,16 11,23 L14,28 L8,28 L11,23 C7,16 7,7 11,0 Z M32,0 C36,7 36,16 32,23 L35,28 L29,28 L32,23 C28,16 28,7 32,0 Z M53,0 C57,7 57,16 53,23 L56,28 L50,28 L53,23 C49,16 49,7 53,0 Z M74,0 C78,7 78,16 74,23 L77,28 L71,28 L74,23 C70,16 70,7 74,0 Z M95,0 C99,7 99,16 95,23 L98,28 L92,28 L95,23 C91,16 91,7 95,0 Z M118,0 C122,7 122,16 118,23 L121,28 L115,28 L118,23 C114,16 114,7 118,0 Z" fill="#F59E0B" fill-opacity="0.82" stroke="#FDE68A" stroke-width="0.5"/>
        </g>

        <g id="trolley">
          <!-- 3D Изометрическая глубина стойки тележки SS304 -->
          <polygon points="0,0 14,-10 150,-10 136,0" fill="rgba(59,130,246,0.16)" stroke="rgba(148,163,184,0.35)" stroke-width="1"/>
          <polygon points="136,0 150,-10 150,325 136,335" fill="rgba(15,23,42,0.75)" stroke="rgba(148,163,184,0.3)" stroke-width="1"/>
          <rect x="0" y="0" width="136" height="335" rx="4" fill="rgba(11,13,20,0.68)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
          <line x1="68" y1="0" x2="68" y2="335" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="4 4"/>
          <path d="M0,36 H136 M0,82 H136 M0,128 H136 M0,174 H136 M0,220 H136 M0,266 H136 M0,312 H136" stroke="#64748B" stroke-width="1.8"/>
          <use href="#fishRow" x="0" y="38"/><use href="#fishRow" x="0" y="84"/><use href="#fishRow" x="0" y="130"/>
          <use href="#fishRow" x="0" y="176"/><use href="#fishRow" x="0" y="222"/><use href="#fishRow" x="0" y="268"/>
          <circle cx="22" cy="344" r="6.5" fill="#0B0D14" stroke="#64748B" stroke-width="2"/>
          <circle cx="114" cy="344" r="6.5" fill="#0B0D14" stroke="#64748B" stroke-width="2"/>
        </g>

        <!-- Пульсирующие маячки ( • ) в стиле bento-vision.html -->
        <g id="beaconBlue">
          <circle cx="0" cy="0" r="12" fill="rgba(59,130,246,0.28)" class="hotspot-pulse"/>
          <circle cx="0" cy="0" r="7.5" fill="#0B0D14" stroke="#38BDF8" stroke-width="2.2"/>
          <circle cx="0" cy="0" r="2.8" fill="#38BDF8"/>
        </g>
        <g id="beaconAmber">
          <circle cx="0" cy="0" r="12" fill="rgba(245,158,11,0.3)" class="hotspot-pulse"/>
          <circle cx="0" cy="0" r="7.5" fill="#0B0D14" stroke="#F59E0B" stroke-width="2.2"/>
          <circle cx="0" cy="0" r="2.8" fill="#F59E0B"/>
        </g>
        <g id="beaconCyan">
          <circle cx="0" cy="0" r="12" fill="rgba(45,212,191,0.28)" class="hotspot-pulse"/>
          <circle cx="0" cy="0" r="7.5" fill="#0B0D14" stroke="#2DD4BF" stroke-width="2.2"/>
          <circle cx="0" cy="0" r="2.8" fill="#2DD4BF"/>
        </g>
      </defs>

      <rect width="1800" height="830" fill="url(#bgDark)"/>
      <rect width="1800" height="830" fill="url(#grid)"/>

      <!-- ВЕРХНЯЯ СВОДКА ВНУТРИ 3D-ХОЛСТА -->
      <g transform="translate(15, 10)" filter="url(#sh)">
        <rect x="0" y="0" width="1770" height="68" rx="14" fill="url(#bentoCard)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
        <text x="20" y="27" font-size="16" font-weight="800" fill="#F8FAFC">
          3D/CAD ЦИФРОВОЙ ДВОЙНИК КОМПЛЕКСА: <tspan id="svgHdrModeText" fill="#60A5FA">AIM AGHD-250ELC + РИЖСКАЯ КАМЕРА (15 ТЕЛЕЖЕК SS304)</tspan>
        </text>
        <text x="20" y="48" font-size="11" font-weight="500" fill="#94A3B8">

    let currentNode = 4;
    let isWinter = true;
    let isFlowAnim = true;

    function renderInspectorGrains(lit, colClass) {
      const bar = document.getElementById('inspGrainBar');
      let html = '';
      for (let i = 0; i < 15; i++) {
        html += `<span class="grain-dot ${i < lit ? colClass : ''}"></span>`;
      }
      bar.innerHTML = html;
    }

    function initPills() {
      const bar = document.getElementById('nodePillsBar');
      bar.innerHTML = '';
      Object.keys(NODES_DB).forEach(k => {
        const num = parseInt(k, 10);
        const info = NODES_DB[num];
        const btn = document.createElement('button');
        btn.className = 'n-pill' + (num === currentNode ? ' active' : '');
        btn.id = 'pill-' + num;
        btn.textContent = info.short;
        btn.onclick = () => selectNode(num);
        bar.appendChild(btn);
      });
    }

    function selectNode(num) {
      currentNode = num;
      const info = NODES_DB[num] || NODES_DB[4];
      document.querySelectorAll('.n-pill').forEach(el => el.classList.remove('active'));
      const activePill = document.getElementById('pill-' + num);
      if (activePill) activePill.classList.add('active');

      document.getElementById('inspTitle').textContent = info.title;
      document.getElementById('inspDesc').textContent = info.desc;
      document.getElementById('inspMetricTxt').textContent = info.metric;
      renderInspectorGrains(info.grains, info.col);
    }

    function setWorkMode(mode) {
      ['btnDry30', 'btnPause18', 'btnFinish25'].forEach(id => document.getElementById(id).classList.remove('active'));
      if (mode === 'DRY_30') {
        document.getElementById('btnDry30').classList.add('active');
        document.getElementById('hdrClimVal').textContent = '+15.8°C • 58%';
        document.getElementById('hdrWaterVal').textContent = '-75.0 л/ч';
        document.getElementById('hdrEevVal').textContent = '315 step • 30Гц';
        document.getElementById('svgCantoniHz').textContent = 'Частотники HAPN: 30.0 Гц (Сушка)';
        document.getElementById('svgEevStepText').textContent = 'Открытие: 315 шагов (Dew Point)';
        document.getElementById('svgDrainText').textContent = 'СЛИВ В ТРАП [21]: ДО 75 Л/Ч КОНДЕНСАТА';
        selectNode(4);
      } else if (mode === 'PAUSE_18') {
        document.getElementById('btnPause18').classList.add('active');
        document.getElementById('hdrClimVal').textContent = '+15.2°C • 74%';
        document.getElementById('hdrWaterVal').textContent = '-4.5 л/ч (Пауза)';
        document.getElementById('hdrEevVal').textContent = '75 step • 18Гц';
        document.getElementById('svgCantoniHz').textContent = 'Частотники HAPN: 18.0 Гц (Пауза диффузии)';
        document.getElementById('svgEevStepText').textContent = 'Дежурный шаг: 75 step (Пауза)';
        document.getElementById('svgDrainText').textContent = 'ПАУЗА ДИФФУЗИИ: ВЫРАВНИВАНИЕ ВЛАГИ ОТ ХРЕБТА';
        selectNode(2);
      } else {
        document.getElementById('btnFinish25').classList.add('active');
        document.getElementById('hdrClimVal').textContent = '+14.0°C • 52%';
        document.getElementById('hdrWaterVal').textContent = '-18.0 л/ч';
        document.getElementById('hdrEevVal').textContent = '195 step • 25.3Гц';
        document.getElementById('svgCantoniHz').textContent = 'Частотники HAPN: 25.3 Гц (Отволаживание 1ч/4ч)';
        document.getElementById('svgEevStepText').textContent = 'Открытие: 195 шагов (Финиш Ст.4)';
        document.getElementById('svgDrainText').textContent = 'СТАДИЯ 4: МЯГКИЙ ДОВОД ПЕРЕД ВАКУУМОМ KOMET';
        selectNode(1);
      }
    }

    function toggleSeason() {
      isWinter = !isWinter;
      const btn = document.getElementById('btnSeason');
      const hVal = document.getElementById('hdrHeatVal');
      const hSub = document.getElementById('hdrSeasonSub');
      const bTitle = document.getElementById('svgBoxTitle');
      const bSub = document.getElementById('svgBoxSub');

      if (isWinter) {
        btn.classList.add('active');
        btn.textContent = 'Зима: +14 кВт в цех (+35°C)';
        hVal.textContent = '+14.0 кВт в цех';
        hSub.textContent = 'Зима (+35°C • 24 бар)';
        bTitle.textContent = 'ТЕРМО-КОРОБ ЭСТАКАДЫ [20] • РЕКУПЕРАЦИЯ 14 кВт';
        bSub.textContent = 'Зима: створки закрыты — возврат +35°C (14 кВт) в цех над мастером';
      } else {
        btn.classList.remove('active');
        btn.textContent = 'Лето: Сброс тепла на улицу';
        hVal.textContent = 'Сброс на улицу';
        hSub.textContent = 'Лето (створки открыты)';
        bTitle.textContent = 'ТЕРМО-КОРОБ ЭСТАКАДЫ [20] • ЛЕТНИЙ СБРОС ТЕПЛА';
        bSub.textContent = 'Лето: передние створки открыты — полный сброс тепла за пределы цеха';
      }
      selectNode(10);
    }

    function toggleFlowAnim() {
      isFlowAnim = !isFlowAnim;
      const board = document.getElementById('svgBoard');
      const btn = document.getElementById('btnFlowAnim');
      if (isFlowAnim) {
        board.classList.remove('flow-paused');
        btn.classList.add('active');
        btn.textContent = 'Потоки 3D: ВКЛ';
      } else {
        board.classList.add('flow-paused');
        btn.classList.remove('active');
        btn.textContent = 'Потоки 3D: ВЫКЛ';
      }
    }

    function downloadSVG() {
      const svgEl = document.getElementById('master-svg');
      let source = new XMLSerializer().serializeToString(svgEl);
      if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      const blob = new Blob(['<?xml version="1.0" standalone="no"?>\r\n' + source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'AIM_AGHD_250ELC_3D_Master_Cutaway.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadPNG() {
      const svgEl = document.getElementById('master-svg');
      let svgStr = new XMLSerializer().serializeToString(svgEl);
      if (!svgStr.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        svgStr = svgStr.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      const canvas = document.createElement('canvas');
      canvas.width = 3600;
      canvas.height = 1660;
      const ctx = canvas.getContext('2d');
      const img = new Image();
      const url = URL.createObjectURL(new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' }));
      img.onload = function () {
        ctx.fillStyle = '#07080C';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (pngBlob) {
          const pngUrl = URL.createObjectURL(pngBlob);
          const a = document.createElement('a');
          a.href = pngUrl;
          a.download = 'AIM_AGHD_250ELC_3D_Master_4K.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(pngUrl);
        }, 'image/png');
      };
      img.src = url;
    }

    initPills();
    selectNode(4);
  </script>
