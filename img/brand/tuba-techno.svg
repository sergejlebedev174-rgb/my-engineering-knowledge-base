</g>
<path d="M32 79 L27 95 L45 86 Z" fill="url(#d)" stroke="#22d3ee" stroke-width="1.1" stroke-linejoin="round" opacity=".95"/>
<path d="M60 79 L63 94 L76 73 Z" fill="url(#d)" stroke="#ffb95f" stroke-width="1.1" stroke-linejoin="round" opacity=".9"/>
<path d="M12 78 C16 60 32 46 52 43 C68 40 80 34 88 22 L99 27 C96 46 86 62 72 72 C58 82 40 90 24 89 C16 88 13 83 12 78 Z" fill="url(#d)"/>
