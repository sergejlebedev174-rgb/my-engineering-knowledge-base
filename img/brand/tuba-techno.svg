  <circle r="3.9" fill="#06131c" stroke="#7df4ff" stroke-width="1.3"/>
  <circle class="eye" r="1.8" fill="#7df4ff" filter="url(#c)"/>
  <circle cx="-.6" cy="-.6" r=".7" fill="#fff"/>
