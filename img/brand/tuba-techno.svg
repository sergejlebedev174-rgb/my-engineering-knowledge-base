<svg viewBox="5 -1 108 108" xmlns="http://www.w3.org/2000/svg">
<!-- Техно-логотип SIA “TUBA” / Юрмалциемс — «многослойный биометрический знак». Источник: js/fish-emblem.js, plain -->
<style>
  .tail{animation:tail 2.4s ease-in-out infinite;transform-origin:94px 25px}
  .fin{animation:fin 3s ease-in-out infinite;transform-origin:60px 48px}
  .flow{animation:flow 1.4s linear infinite}
  .eye{animation:eye 2.2s ease-in-out infinite}
  .wire{animation:wire 3s ease-in-out infinite}
  @keyframes tail{50%{transform:rotate(7deg)}}
  @keyframes fin{50%{transform:rotate(-5deg) scale(.97)}}
  @keyframes flow{to{stroke-dashoffset:-16}}
  @keyframes eye{50%{opacity:.45}}
  @keyframes wire{0%,100%{stroke-opacity:.7}50%{stroke-opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <filter id="c" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4" result="b1"/><feGaussianBlur stdDeviation="0.9" result="b2"/><feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="a" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="o" x1="0" x2="1" y1="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset=".6" stop-color="#ffb95f"/><stop offset="1" stop-color="#ffe0a3"/></linearGradient>
  <linearGradient id="d" x1="0" x2="1" y1="1" y2="0"><stop offset="0" stop-color="#0b2a3a"/><stop offset=".45" stop-color="#0d3b4f"/><stop offset="1" stop-color="#06131c"/></linearGradient>
  <radialGradient id="e" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#7df4ff"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  <clipPath id="k"><path d="M12 78 C16 60 32 46 52 43 C68 40 80 34 88 22 L99 27 C96 46 86 62 72 72 C58 82 40 90 24 89 C16 88 13 83 12 78 Z"/></clipPath>
</defs>
<g class="tail">
