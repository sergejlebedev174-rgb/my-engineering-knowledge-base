    <path d="M90 26 C91 33 91 41 88 49" stroke="#ffb95f" opacity=".7"/>
  </g>
  <g fill="#7df4ff" opacity=".35"><rect x="48" y="57" width="6" height="2" rx="1"/><rect x="60" y="54" width="5" height="2" rx="1"/><rect x="71" y="49" width="4" height="2" rx="1"/></g>
</g>
