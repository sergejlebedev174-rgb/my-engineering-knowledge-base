  <g stroke="#ffb95f" stroke-width=".7" opacity=".75"><line x1="92" y1="21" x2="84" y2="6"/><line x1="93" y1="20" x2="89" y2="8"/><line x1="95" y1="21" x2="104" y2="10"/><line x1="96" y1="23" x2="108" y2="10"/></g>
</g>
